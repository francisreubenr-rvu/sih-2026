            /**
             * Compute Levenshtein distance between two strings
             * (number of single-character edits needed to match)
             */
            function levenshtein(a, b) {
                const matrix = [];
                for (let i = 0; i <= b.length; i++)
                    matrix[i] = [i];
                for (let j = 0; j <= a.length; j++)
                    matrix[0][j] = j;
                for (let i = 1; i <= b.length; i++) {
                    for (let j = 1; j <= a.length; j++) {
                        const cost = a[j - 1] === b[i - 1] ? 0 : 1;
                        matrix[i][j] = Math.min(
                                matrix[i - 1][j] + 1, // deletion
                                matrix[i][j - 1] + 1, // insertion
                                matrix[i - 1][j - 1] + cost // substitution
                                );
                    }
                }
                return matrix[b.length][a.length];
            }

            // max 2 instances of mismatch
            function getFuzzyDomainMatch(inputDomain, threshold = 2) {
                for (const domain of domains) {
                    const distance = levenshtein(inputDomain, domain);
                    if (distance <= threshold) {
                        return {
                            match: true,
                            trustedDomain: domain,
                            distance: distance
                        };
                    }
                }
                return {match: false};
            }

            function validateFields() {
                if (($("#fullname").val() === null) || ($("#fullname").val() === "")) {

                    return false;
                }

                if (($("#loginid").val() === null) || ($("#loginid").val() === "")) {

                    return false;

                var pc = $("#pincode").val();
                pc = pc.split("-").join("").trim();

                    bhooinfo('Pincode is empty, please check');
                    return false;

                    if ($("#country").val().toUpperCase() === "INDIA") {

                    }
