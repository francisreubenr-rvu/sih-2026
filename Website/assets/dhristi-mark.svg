<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Dhristi">
  <!-- Original pixel aperture mark: navy field, paper ring, saffron focus -->
  <rect width="64" height="64" fill="#162b46"/>
  <!-- stepped outer frame -->
  <path fill="#101827" d="M4 8h4V4h48v4h4v48h-4v4H8v-4H4V8z"/>
  <path fill="#f3ead8" d="M8 12h4v-4h40v4h4v40h-4v4H12v-4H8V12z"/>
  <!-- aperture rings -->
  <rect x="18" y="18" width="28" height="28" fill="none" stroke="#162b46" stroke-width="2"/>
  <rect x="22" y="22" width="20" height="20" fill="#c7d5d2"/>
  <rect x="26" y="26" width="12" height="12" fill="#162b46"/>
  <!-- saffron focus block (action accent only) -->
  <rect x="28" y="28" width="8" height="8" fill="#d88732"/>
  <!-- corner ticks -->
  <rect x="16" y="16" width="4" height="2" fill="#101827"/>
  <rect x="16" y="16" width="2" height="4" fill="#101827"/>
  <rect x="44" y="16" width="4" height="2" fill="#101827"/>
  <rect x="46" y="16" width="2" height="4" fill="#101827"/>
  <rect x="16" y="46" width="4" height="2" fill="#101827"/>
  <rect x="16" y="44" width="2" height="4" fill="#101827"/>
  <rect x="44" y="46" width="4" height="2" fill="#101827"/>
  <rect x="46" y="44" width="2" height="4" fill="#101827"/>
</svg>
