# Warden unit tests. No model weights and no Ollama: GLiNER- and Ollama-backed tests skip by
# design (WARDEN_TEST_LOAD_GLINER / WARDEN_TEST_OLLAMA unset). Node must be on PATH so the
# regex-parity tests run the real extension/utils/redactor.js instead of skipping.
name: Warden tests

on:
  pull_request:
    paths:
      - 'warden/**'
      - 'extension/utils/redactor.js'
      # Parity tests in test_warden.py run the real op-tier.js and plan-check.js.
      - 'extension/utils/op-tier.js'
      - 'extension/utils/plan-check.js'
      - 'scripts/tests/**'
      - 'scripts/check_release.py'
      - 'scripts/score-*.py'
      - 'Guardrails/**'
      - 'Benchmarks/release-status.json'
      - '.github/workflows/warden-test.yml'
  push:
    branches: [master, 'brain/**', 'feat/**', 'cursor/**']
    paths:
      - 'warden/**'
      - 'extension/utils/redactor.js'
      # Parity tests in test_warden.py run the real op-tier.js and plan-check.js.
      - 'extension/utils/op-tier.js'
      - 'extension/utils/plan-check.js'
      - 'scripts/tests/**'
      - 'scripts/check_release.py'
      - 'scripts/score-*.py'
      - 'Guardrails/**'
      - 'Benchmarks/release-status.json'
      - '.github/workflows/warden-test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: warden-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Warden pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: warden/requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install -r warden/requirements-test.txt

      - name: Run tests
        working-directory: warden
        shell: bash
        run: |
          set -o pipefail
          node --version
          python -m pytest -rs test_warden.py test_pii_layers.py | tee pytest.log
          # A missing node would turn the regex-parity tests into silent skips.
          if grep -E '^SKIPPED.*node is not on PATH' pytest.log; then
            echo "::error::regex-parity tests skipped: node is not on PATH"
            exit 1
          fi

      - name: Script tests
        run: python -m pytest -q scripts/tests

      - name: Ledger matches the committed release-status.json
        shell: bash
        run: |
          # check_release.py exits 1 while any gate fails or is unknown; that is
          # expected. What must hold is that the committed ledger is current.
          python scripts/check_release.py --dry-run > ledger.json || true
          python -c "import json,sys; d=json.load(open('ledger.json')); sys.exit(0 if d.get('committed_ledger_matches') else 1)"
